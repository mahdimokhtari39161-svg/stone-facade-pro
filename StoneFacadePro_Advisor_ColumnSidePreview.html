// Restore the most recent editable scene before the original first build() call.
window.sfdRestoreDraftBeforeBuild = function(){
  try{
    const raw=localStorage.getItem('sfd_pro_autodraft'); if(!raw)return;
    const d=JSON.parse(raw); if(!d || !d.cfg || !d.asg || d.cfg.imp)return;
    if(Date.now()-(d.savedAt||0)>30*24*60*60*1000)return;
    cfg={...cfg,...d.cfg}; asg={...d.asg};
    if(Array.isArray(d.cols)){cols=d.cols;cid=cols.reduce((m,o)=>Math.max(m,+o.id||0),0)+1;}
    if(d.cur && stones.some(x=>x.id==d.cur))cur=d.cur;
    if(typeof d.sel==='string')sel=d.sel;
    sfdDraftRestored=true;
  }catch(e){console.warn('Auto-recovery skipped',e)}
};

// Performance tuning for phones/tablets with modest GPUs.
try{
  const mobileNow=matchMedia('(max-width:900px)').matches;
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,mobileNow?1.35:2));

// Real two-finger zoom + one-finger orbit/pan. Retains the existing model-placement click behavior.
const sfdPointers=new Map(); let sfdPinch=0, sfdStartX=0, sfdStartY=0, sfdGestureMoved=0, sfdPointerStart=0;
const sfdDistance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
cv.onpointerdown=e=>{
  sfdPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(sfdPointers.size===1){dn=1;mv=0;sfdGestureMoved=0;sfdStartX=e.clientX;sfdStartY=e.clientY;lx=e.clientX;ly=e.clientY;sfdPointerStart=e.pointerId;}
  else if(sfdPointers.size===2){const p=[...sfdPointers.values()];sfdPinch=sfdDistance(p[0],p[1]);dn=1;mv=10;sfdGestureMoved=10;}
  e.preventDefault();
};
cv.onpointermove=e=>{
  if(!sfdPointers.has(e.pointerId))return;
  const old=sfdPointers.get(e.pointerId);sfdPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(sfdPointers.size>=2){const p=[...sfdPointers.values()].slice(0,2),d=sfdDistance(p[0],p[1]);if(sfdPinch>0&&d>0)dist=Math.min(160,Math.max(1.5,dist*(sfdPinch/d)));sfdPinch=d;sfdGestureMoved=10;mv=10;e.preventDefault();return;}
  const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;sfdGestureMoved+=Math.abs(dx)+Math.abs(dy);mv=sfdGestureMoved;
  if(e.shiftKey||(e.buttons&2)){tgt.x-=Math.cos(th)*dx*dist*.002;tgt.z+=Math.sin(th)*dx*dist*.002;tgt.y+=dy*dist*.002;}
  else{th-=dx*.008;ph=Math.min(3.1,Math.max(.05,ph-dy*.008));}
  e.preventDefault();
};
cv.onpointerup=e=>{
  const wasSingle=sfdPointers.size===1; sfdPointers.delete(e.pointerId);
  if(sfdPointers.size<2)sfdPinch=0;
  if(!sfdPointers.size){dn=0;
    if(wasSingle&&sfdGestureMoved<5){if(plc&&selCol&&PLACE(e.clientX,e.clientY)){sfdCloseDrawers();return;}const k=pick(e.clientX,e.clientY);if(k){sel=k;refresh();}}
    sfdCloseDrawers();
  }
  e.preventDefault();
};
cv.onpointercancel=e=>{sfdPointers.delete(e.pointerId);sfdPinch=0;dn=sfdPointers.size>0?1:0;};

// Autosave only the editable parametric scene. Imported mesh geometry is deliberately not misrepresented as saved.
function sfdScheduleDraft(){
  if(cfg && cfg.imp)return;
  clearTimeout(sfdDraftTimer);
  sfdDraftTimer=setTimeout(()=>{
    try{
      const draft={version:1,savedAt:Date.now(),cfg:sfdClone(cfg),asg:sfdClone(asg),cols:sfdClone(cols||[]),cur,sel};
      localStorage.setItem('sfd_pro_autodraft',JSON.stringify(draft));
      const st=document.getElementById('sfdStatus');if(st)st.textContent='● ذخیره خودکار';
    }catch(e){const st=document.getElementById('sfdStatus');if(st)st.textContent='! حافظه محدود';console.warn('Autosave failed',e)}
  },650);
}
const sfdRefreshCore=refresh;
refresh=function(){sfdRefreshCore();sfdScheduleDraft()};
try{const sfdRebuildCore=rebuildCols;rebuildCols=function(){sfdRebuildCore();sfdScheduleDraft()}}catch(e){}
window.addEventListener('pagehide',()=>{try{if(!cfg.imp)localStorage.setItem('sfd_pro_autodraft',JSON.stringify({version:1,savedAt:Date.now(),cfg,asg,cols,cur,sel}))}catch(e){}});

function sfdCleanStone(st){const x={...st};delete x.tex;delete x.thumb;return x}
window.sfdExportBackup=function(){
  try{
    const pack={app:'Stone Facade Designer Pro',formatVersion:1,exportedAt:new Date().toISOString(),settings:sfdClone(S),customer:U? sfdClone(U):null,stones:stones.map(sfdCleanStone),favorites:sfdClone(fv||[]),projects:sfdClone(D||[]),current:{cfg:sfdClone(cfg),asg:sfdClone(asg),columns:sfdClone(cols||[]),selectedStone:cur,selectedPart:sel},autoDraft:localStorage.getItem('sfd_pro_autodraft')||null};
    const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Stone_Facade_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('فایل پشتیبان پروژه آماده شد');
  }catch(e){toast('ساخت پشتیبان انجام نشد: '+e.message)}
};
window.sfdImportBackup=function(input){
  const f=input.files&&input.files[0];if(!f)return;if(f.size>35*1024*1024){toast('حجم فایل پشتیبان بیشتر از ۳۵ مگابایت است');input.value='';return;}
  const r=new FileReader();r.onload=()=>{try{
    const p=JSON.parse(r.result);if(!p||p.app!=='Stone Facade Designer Pro'||p.formatVersion!==1)throw new Error('ساختار فایل پشتیبان پشتیبانی نمی‌شود');
    if(!Array.isArray(p.stones)||!p.stones.length)throw new Error('کتابخانه سنگ معتبر نیست');
    if(!confirm('اطلاعات محلی فعلی با اطلاعات فایل پشتیبان جایگزین می‌شود. ادامه می‌دهید؟'))return;
    if(p.settings&&typeof p.settings==='object'){S={...S,...p.settings};localStorage.setItem('sfd_s',JSON.stringify(S))}
    if(p.customer){U=p.customer;localStorage.setItem('sfd_u',JSON.stringify(U))}
    stones=p.stones.map((x,i)=>({...x,id:Number(x.id)||i+1,slab:Array.isArray(x.slab)?x.slab:[60,60],on:x.on??1}));SV();
    if(Array.isArray(p.favorites)){fv=p.favorites;localStorage.setItem('sfd_f',JSON.stringify(fv))}
    if(Array.isArray(p.projects)){D=p.projects;localStorage.setItem('sfd_d',JSON.stringify(D))}
    if(p.current&&p.current.cfg&&p.current.asg&&!p.current.cfg.imp){cfg={...cfg,...p.current.cfg};asg={...p.current.asg};if(Array.isArray(p.current.columns)){cols=p.current.columns;localStorage.setItem('sfd_cols',JSON.stringify({cols}))}if(p.current.selectedStone)cur=p.current.selectedStone;if(typeof p.current.selectedPart==='string')sel=p.current.selectedPart;}
    if(p.autoDraft)localStorage.setItem('sfd_pro_autodraft',p.autoDraft);
    applyAll();hd();build();refresh();hide();toast('پشتیبان بازیابی شد');
  }catch(e){toast('بازیابی ناموفق: '+e.message)}finally{input.value=''}};r.readAsText(f);
};

// Scaled model import: user supplies the true longest dimension in metres.
window.sfdOpenScaledImport=function(){
 show(`<h3>📐 بارگذاری مدل با مقیاس واقعی</h3><p class="sfd-note">نسخه قبلی مدل را به‌صورت خودکار تا ۲۰ متر تغییر اندازه می‌داد. در این مسیر، بزرگ‌ترین بُعد واقعی مدل را وارد کنید تا مدل با همان مقیاس نمایش داده شود. واحد فایل باید از قبل مشخص باشد.</p>
 <label>فایل سه‌بعدی <input id="sfdScaleFile" type="file" accept=".obj,.glb,.gltf,.stl"></label>
 <label>بزرگ‌ترین بُعد واقعی مدل (متر) <input id="sfdScaleMeters" type="number" min="0.01" max="10000" step="0.01" value="20"></label>
 <p class="sfd-note">فرمت‌های پشتیبانی‌شده: OBJ، GLB، GLTF، STL. فایل‌های GLTF که به تصاویر/فایل‌های جانبی خارج از فایل اصلی وابسته‌اند ممکن است به بسته‌بندی کامل نیاز داشته باشند.</p>
 <button class="pri" onclick="sfdLoadScaledModel()">بارگذاری و اعمال مقیاس</button> <button onclick="hide()">انصراف</button>`);
};
window.sfdLoadScaledModel=function(){
 const file=document.getElementById('sfdScaleFile')?.files?.[0],meters=+(document.getElementById('sfdScaleMeters')||{}).value;
 if(!file)return toast('ابتدا فایل مدل را انتخاب کنید');if(!(meters>0&&meters<=10000))return toast('بُعد واقعی مدل باید عددی مثبت باشد');
 const ext=file.name.split('.').pop().toLowerCase();if(!['obj','glb','gltf','stl'].includes(ext))return toast('فرمت این فایل پشتیبانی نمی‌شود');
 const done=o=>{try{setModel(o);const factor=meters/20;if(G&&Number.isFinite(factor)&&factor>0){G.scale.multiplyScalar(factor);G.updateMatrixWorld(true);for(const k in area)area[k]*=factor*factor;tgt.multiplyScalar(factor);dist*=factor;env();refresh();}hide();toast('مدل بارگذاری شد؛ بزرگ‌ترین بُعد: '+meters+' متر')}catch(e){toast('خطا در آماده‌سازی مدل: '+e.message)}};
 const reader=new FileReader();reader.onerror=()=>toast('خواندن فایل ناموفق بود');
 if(ext==='obj'){reader.onload=()=>{try{done(new T.OBJLoader().parse(reader.result))}catch(e){toast('فایل OBJ معتبر نیست')}};reader.readAsText(file)}
 else if(ext==='stl'){reader.onload=()=>{try{done(new T.Mesh(new T.STLLoader().parse(reader.result)))}catch(e){toast('فایل STL معتبر نیست')}};reader.readAsArrayBuffer(file)}
 else{reader.onload=()=>{try{new T.GLTFLoader().parse(reader.result,'',g=>done(g.scene),e=>toast('خواندن GLTF ناموفق بود'))}catch(e){toast('فایل GLB/GLTF معتبر نیست')}};reader.readAsArrayBuffer(file)}
};
